- type: entity
  id: ESBaseSecretDoor
  parent: BaseStructure
  name: solid wall # No meta
  suffix: secret door
  abstract: true
  description: Keeps the air in and the greytide out.
  components:
  - type: ESDestroyOnUnanchor
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Door
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0.2
    closeTimeTwo: 0.6
    openTimeOne: 0.6
    openTimeTwo: 0.2
    openingAnimationTime: 1.2
    closingAnimationTime: 1.2
  - type: Appearance
  - type: Airtight
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: Occluder
  - type: Tag
    tags:
    - Structure
    - Wall
    - ForceNoFixRotations # Don't want the fixrotations command to target these
  - type: BlockWeather

- type: entity
  id: ESSecretDoorSolid
  name: solid wall
  parent: ESBaseSecretDoor
  components:
  - type: Construction
    graph: Girder
    node: ESSecretDoorSolid
  - type: Sprite
    sprite: _ES/Structures/Doors/secret_door_solid.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]

- type: entity
  id: ESSecretDoorReinforced
  name: reinforced wall
  parent: ESBaseSecretDoor
  components:
  - type: Construction
    graph: Girder
    node: ESSecretDoorReinforced
  - type: Sprite
    sprite: _ES/Structures/Doors/secret_door_reinforced.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
